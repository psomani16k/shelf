[package]
name = "shelf-core"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "fs", "macros", "io-util"] }
tracing = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
sha1 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
image = { workspace = true }
tokio-util = { workspace = true, features = ["time"] }
jiff = { workspace = true }

shelf-proto = { path = "../proto" }

fast_image_resize = { version = "6.1.0", features = ["image"] }
rbook = { version = "0.7.12", default-features = false, features = ["threadsafe", "prelude"] }

[dev-dependencies]
tempfile = { workspace = true }
# test-util: `#[tokio::test(start_paused = true)]`
tokio = { workspace = true, features = ["macros", "test-util"] }
