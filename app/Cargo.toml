[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

shelf-core = { path = "../crates/core" }
shelf-proto = { path = "../crates/proto" }

tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "~2.9"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "android")'.dependencies]
# tracing-logcat 0.1.0 fails to compile once serde_json is in the build (tracing-subscriber's json).
paranoid-android = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
