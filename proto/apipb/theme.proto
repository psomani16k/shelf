syntax = "proto3";

package apipb;

import "configpb/theme.proto";

message ThemeSource {
  enum Value {
    BUILT_IN = 0;
    // The user's own theme with a built-in's id, shown in its place.
    OVERRIDDEN = 1;
    CUSTOM = 2;
  }
}

message ThemeEntry {
  // From the name (`configpb.ReaderThemeSpec`); what `ReaderConfig.theme` holds.
  string id = 1;
  ThemeSource.Value source = 2;
  configpb.ReaderThemeSpec spec = 3;
}

message ListThemesRequest {
  string user = 1;
}

// Every theme the user can pick: the built-ins in their order, then the user's own by name.
message ListThemesResponse {
  repeated ThemeEntry themes = 1;
  // The theme used when the config names none, or one that's gone.
  string default_id = 2;
}

// Creates the theme, or replaces the user's one with the same id.
message SetThemeRequest {
  string user = 1;
  configpb.ReaderThemeSpec spec = 2;
}

// Deletes the user's theme; deleting one that overrides a built-in brings the built-in back.
message DeleteThemeRequest {
  string user = 1;
  string name = 2;
}

// Renames the user's theme, and the config's choice with it.
message RenameThemeRequest {
  string user = 1;
  string from = 2;
  string to = 3;
}
