syntax = "proto3";

package apipb;

// In order: each role can do everything the ones before it can, so a check is `role >= needed`.
// The order is the numbers: a new role goes where it belongs and the ones above it move up.
message Role {
  enum Value {
    BANNED = 0; // can only sign in to be told so; the value when "role" is left out
    READER = 1; // read books and keep their own progress
    CONTRIBUTOR = 2; // also add books and folders
    LIBRARIAN = 3; // also delete books and folders
    ADMIN = 4; // rebuild the index, clean up progress, approve sign-ups, manage everyone below admin
    OWNER = 5; // also make, change and ban admins; given or taken only by editing data.json
  }
}

message User {
  string username = 1;
  Role.Value role = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // What the client calls the device it's on ("OnePlus 11 5G", "Firefox on Linux"), shown in the
  // user's session list. Kept with the session, never logged; at most 64 characters are kept.
  string device = 3;
}

message LoginResponse {
  // Sent as `Authorization: Bearer <token>` on every later request.
  string token = 1;
  User user = 2;
}

message LogoutRequest {}

// Also signs out every other session of the user.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

// One of the signed-in user's sessions.
message SessionInfo {
  // Not the token or its hash: derived from the hash, for `EndSessionRequest`.
  string id = 1;
  // "" for a session from before devices were recorded.
  string device = 2;
  // RFC 3339.
  string created = 3;
  // Roughly when it was last used, to within a day (sessions are extended at most once a day).
  string active = 4;
  // The session making this request.
  bool current = 5;
}

message ListSessionsRequest {}

// The current session first, then the most recently active.
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// Signs out another of the user's sessions; answered with the sessions left.
message EndSessionRequest {
  string id = 1;
}

// Asks for an account; an admin approves it and picks the role.
message SignUpRequest {
  string username = 1;
  string password = 2;
}

// A pending sign-up, as an admin sees it. The password is never sent.
message UserRequest {
  string id = 1;
  string username = 2;
  // RFC 3339.
  string created = 3;
  // A user already has the name, so it can only be denied.
  bool taken = 4;
}

message ListUserRequestsRequest {}

message ListUserRequestsResponse {
  repeated UserRequest requests = 1;
}

message ApproveUserRequestRequest {
  string id = 1;
  Role.Value role = 2;
}

message DenyUserRequestRequest {
  string id = 1;
}

// Every user, by name.
message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
  // Keyed by username; every user has one.
  map<string, UserScope> scopes = 2;
}

// A user's part of the library; serverpb.ServerUser has the rules.
message UserScope {
  // A folder path relative to the library; "" is all of it.
  string library_root = 1;
  // Globs relative to `library_root`.
  repeated string books = 2;
}

// Banning also signs the user out everywhere.
message SetUserRoleRequest {
  string username = 1;
  Role.Value role = 2;
}

// Applies from the user's next request. Admins set the scopes of users below admin,
// owners admins' too; nobody sets their own or an owner's.
message SetUserScopeRequest {
  string username = 1;
  UserScope scope = 2;
}
