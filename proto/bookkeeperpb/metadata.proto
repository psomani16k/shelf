syntax = "proto3";

package bookkeeperpb;

message BookMetadata {
  string path = 1;
  optional string title = 2;
  repeated string authors = 3;
  BookFileType.Value file_type = 4;
  string id = 5;
  // When this was last written after hashing the file: RFC 3339 UTC, whole seconds (core's `Time`).
  // A book whose file mtime isn't newer isn't hashed again at startup.
  optional string last_update_time = 6;
}

message FolderListing {
  repeated string folders = 1;
  repeated BookMetadata books = 2;
}

message BookFileType {
  enum Value {
    UNKNOWN = 0;
    EPUB = 1;
  }
}
