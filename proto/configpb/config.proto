syntax = "proto3";

package configpb;

// Scalar and enum fields must be `optional`, so a partial `set_config` can tell "not sent" from the zero value.
message Config {
  ReaderConfig reader = 1;
  UiConfig ui = 2;
  reserved 3;
  reserved "developer";
}

message ReaderConfig {
  optional ReaderFlow.Value flow = 1;
  reserved 2;
  optional ReaderMargins margins = 3;
  // A theme's id (apipb.ThemeEntry). Unset, or one the list doesn't have, is its default.
  optional string theme = 4;
  optional ReaderImages.Value images = 5;
}

message ReaderFlow {
  enum Value {
    SCROLLED = 0;
    PAGINATED = 1;
  }
}

// What the reader theme does to the book's images.
message ReaderImages {
  enum Value {
    // Images keep their own colours: the layers marked `skip_images` aren't applied to them.
    KEEP = 0;
    // Images get every layer, like the page.
    LIKE_PAGE = 1;
  }
}

message ReaderMargins {
  optional ReaderMargin.Value top = 1;
  optional ReaderMargin.Value bottom = 2;
  optional ReaderMargin.Value side = 3;
  optional ReaderMargin.Value between_pages = 4;
}

message ReaderMargin {
  enum Value {
    // The default, so it's the zero value.
    MEDIUM = 0;
    NONE = 1;
    SMALL = 2;
    LARGE = 3;
  }
}

message UiConfig {
  optional UiTheme.Value theme = 1;
}

message UiTheme {
  enum Value {
    SYSTEM = 0;
    LIGHT = 1;
    DARK = 2;
  }
}
